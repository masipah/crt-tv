name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: node --test remote/test/*.test.mjs
      - run: lua tools/test/startup.lua
      - run: luac -p scripts/*.lua scripts/startup/*.lua
      - run: for file in scripts/tv scripts/*.sh setup/*.sh setup/migrations/*.sh; do bash -n "$file" || exit; done
      - run: python3 tools/build-splash-frames.py && git diff --exit-code
