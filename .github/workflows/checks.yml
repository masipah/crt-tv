name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 python3-pil mpv
      - run: python3 tools/build-splash-frames.py
      - run: node --test remote/test/*.test.mjs
      - run: python3 tools/test/resume.py
      - run: lua tools/test/startup.lua
      - run: luac -p scripts/*.lua scripts/startup/*.lua
      - run: for file in scripts/tv scripts/*.sh setup/*.sh setup/migrations/*.sh hat/*.sh; do bash -n "$file" || exit; done
      - run: python3 -m py_compile hat/face.py hat/prepare-mouth-clips.py
      - run: /usr/bin/python3 -m unittest discover -s hat
      - run: luac -p .build/splash/startup/frames.lua
