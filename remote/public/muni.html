<!doctype html>
<html lang="ja" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MUNI · 到着案内</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0e;color:#f8f8ef;font-family:Arial,'Droid Sans Fallback','Noto Sans CJK JP',sans-serif}
#screen{position:fixed;left:0;top:0;width:720px;height:480px;transform-origin:0 0;padding:14px 18px 0;background:#11161c}
.columns,.row{display:grid;grid-template-columns:124px 122px 278px 1fr;gap:0;align-items:center}.columns{height:66px;background:#293846;font-size:28px;line-height:30px;font-weight:bold;text-align:center;color:#e8eef2;border-bottom:2px solid #a1aab1}.columns span:nth-child(3){text-align:left;padding-left:13px}
#departures{position:relative;height:400px;background:#080b0e;overflow:hidden}.row{position:absolute;left:0;right:0;top:0;height:100px;will-change:transform;transition:transform 650ms cubic-bezier(.22,.7,.2,1),opacity 650ms ease;border-bottom:2px solid #68737c;padding:0 2px}.service{height:82px;margin-right:5px;display:flex;align-items:center;justify-content:space-between;padding:5px 7px;background:#f4e329;color:#101318;font-weight:bold}.service .name{font-size:23px;line-height:27px;max-width:48px}.service .number{font:bold 44px Arial}.service.bus{background:#da2236;color:#fff}.service.replacement{background:#eb9d36;color:#111}.service.owl{background:#27705d;color:#fff}.time{text-align:center;font:bold 39px Arial;font-variant-numeric:tabular-nums;line-height:44px}.time small{display:block;font:20px Arial;line-height:25px;color:#cad7df}.destination{font-size:28px;line-height:33px;font-weight:bold;white-space:pre-line;padding-left:13px;padding-right:4px;overflow-wrap:anywhere;max-height:68px;overflow:hidden}.destination.latin{font-size:32px;line-height:36px;max-height:74px;font-weight:900;letter-spacing:-.4px}.stop{font-size:26px;line-height:28px;font-weight:bold;text-align:center;white-space:pre-line}.stop small{display:block;font-size:19px;line-height:24px;font-weight:bold;color:#cad7df}.placeholder{position:absolute;left:0;right:0;top:0;height:100px;border-bottom:2px solid #68737c;color:#64727a;text-align:center;font-size:28px;line-height:98px}.message{font-size:32px;text-align:center;padding:120px 8px;color:#f4e329}.message small{display:block;font-size:23px;color:#d8dcd8;margin-top:20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style></head><body><main id="screen">
<div class="columns"><span>種別<br>系統</span><span>到着<br>時刻</span><span>行き先</span><span id="stop-heading">停留所</span></div>
<section id="departures" aria-label="最寄り４停留所の到着予定・時刻順"><div class="message">運行情報を取得中</div></section>
<p class="sr">Live SFMTA arrivals at Haight and Gough, Market and Gough, inbound and outbound. One fixed screen with four departures ordered by arrival time. No interactive controls.</p>
