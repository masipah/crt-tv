# Only the Pi web server controls this sender; no second unauthenticated LAN UI.
general {
  uid = "owntone"
  db_path = "/run/crt-owntone/songs3.db"
  cache_dir = "/run/crt-owntone"
  logfile = "/run/crt-owntone/owntone.log"
  loglevel = warning
  ipv6 = no
  bind_address = "127.0.0.1"
  trusted_networks = { "localhost" }
}
library {
  name = "CRT-TV"
  port = 3689
  directories = { "/srv/owntone-pipe" }
  pipe_autostart = true
  follow_symlinks = false
}
audio { type = "disabled" }
