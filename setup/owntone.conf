# LAN discovery requires an unrestricted bind address: OwnTone also uses it
# to choose the mDNS interface. The service firewall keeps control ports local.
general {
  uid = "owntone"
  db_path = "/run/crt-owntone/songs3.db"
  cache_dir = "/run/crt-owntone"
  logfile = "/run/crt-owntone/owntone.log"
  loglevel = warning
  ipv6 = no
  trusted_networks = { "localhost" }
}
library {
  name = "CRT-TV"
  port = 3689
  directories = { "/srv/owntone-pipe" }
  pipe_autostart = true
  follow_symlinks = false
}
audio { type = "disabled" }
